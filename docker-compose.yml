services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    user: "${PROTOLABEL_UID:-1000}:${PROTOLABEL_GID:-1000}"
    environment:
      PROTOLABEL_WORKSPACE_ROOT: /workspace
      PROTOLABEL_DATA_DIR: /workspace/data
      PROTOLABEL_MODEL_DIR: /models
      PROTOLABEL_ROOT: /workspace
      PROTOLABEL_JOB_WORKERS: ${PROTOLABEL_JOB_WORKERS:-2}
      PROTOLABEL_MAX_UPLOAD_BYTES: ${PROTOLABEL_MAX_UPLOAD_BYTES:-2147483648}
      PROTOLABEL_SESSION_TTL_SECONDS: ${PROTOLABEL_SESSION_TTL_SECONDS:-604800}
      PROTOLABEL_COOKIE_SECURE: ${PROTOLABEL_COOKIE_SECURE:-false}
      CORS_ORIGINS: http://localhost:8101,http://127.0.0.1:8101
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${PROTOLABEL_HOST_WORKSPACE:-..}:/workspace
      - ./models:/models:ro
    gpus: all
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8101:80"
